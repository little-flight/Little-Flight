<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  
  <title>Little Flight</title>
  
  <link rel="stylesheet" type="text/css" href="./css/Style.css">
  <link rel="icon" href="./logo.png">
  
  <meta
    content="width=device-width, initial-scale=1.0"
    name="viewport"
  >
  <meta
    content="A Small 2D Flight Game That's Cozily Pixelated!"
    name="description"
  >
  <meta
    content="flight simulator, pixel art, 2D game"
    name="keywords"
  >

  <meta
    data-n-head="ssr"
    data-hid="theme-color"
    name="theme-color"
    content="#770618"
  >

  <meta
    data-n-head="ssr"
    data-hid="og:image"
    name="og:image"
    property="og:image"
    content="https://little-flight.attaditya.space/logo.png"
  >
  
  <meta
    data-n-head="ssr"
    data-hid="og:image:width"
    name="og:image:width"
    property="og:image:width"
    content="512"
  >
  
  <meta
    data-n-head="ssr"
    data-hid="og:image:height"
    name="og:image:height"
    property="og:image:height"
    content="512"
  >
</head>

<body>
  <div id="root">
    <div id="canvas-container">
      <canvas id="planeCanvas"></canvas>
      <div id="instrumentCanvases">
        <canvas id="instrumentCanvas"></canvas>
      </div>
      <canvas id="canvas"></canvas>
      <canvas id="timeCycle"></canvas>

      <div class="controls">
        <div class="controls-grid controls-left">
          <button
            class="controls-element-1 controls-button"
            onpointerdown="touchDown('ArrowUp')"
            onpointerup="touchUp('ArrowUp')"
          >
            <img src="./assets/controls/touch/fast.png" alt="Fly Fast">
          </button>
          
          <button class="controls-element-2"></button>
          <button class="controls-element-3"></button>
          <button class="controls-element-4"></button>
          <button class="controls-element-5"></button>
          <button class="controls-element-6"></button>
          
          <button
            class="controls-element-7 controls-button"
            onpointerdown="touchDown('ArrowDown')"
            onpointerup="touchUp('ArrowDown')"
          >
            <img src="./assets/controls/touch/slow.png" alt="Fly Slow">
          </button>
          
          <button class="controls-element-8"></button>
          <button class="controls-element-9"></button>
        </div>

        <div class="controls-grid controls-right">
          <button class="controls-element-1"></button>
          
          <button
            class="controls-element-2 controls-button"
            onpointerdown="touchDown(']')"
            onpointerup="touchUp(']')"
          >
            <img src="./assets/controls/touch/up.png" alt="Fly Up">
          </button>
          
          <button class="controls-element-3"></button>
          
          <button
            class="controls-element-4 controls-button"
            onpointerdown="touchDown('ArrowLeft')"
            onpointerup="touchUp('ArrowLeft')"
          >
            <img src="./assets/controls/touch/left.png" alt="Fly Left">
          </button>

          <button class="controls-element-5"></button>
          
          <button
            class="controls-element-6 controls-button"
            onpointerdown="touchDown('ArrowRight')"
            onpointerup="touchUp('ArrowRight')"
          >
            <img src="./assets/controls/touch/right.png" alt="Fly Right">
          </button>
          
          <button class="controls-element-7"></button>
          
          <button
            class="controls-element-8 controls-button"
            onpointerdown="touchDown('[')"
            onpointerup="touchUp('[')"
          >
            <img src="./assets/controls/touch/down.png" alt="Fly Down">
          </button>
          
          <button class="controls-element-9"></button>
        </div>
      </div>
    </div>

    <div class="home-menu">
      <div class="title">
        <h1>Little Flight</h1>
      </div>

      <div class="actions">
        <button class="button" id="start">
          Play
        </button>

        <button
          class="button"
          onclick="document.getElementById('control-popup').showModal()"
        >
          Controls
        </button>
      </div>
    </div>

    <div class="nerd-stats">
      <label id="coords">X = 0 Y = 0</label>
      <label id="altitude">Altitude = 0</label>
    </div>

    <dialog id="control-popup" class="control-popup">
      <div
        class="control-popup-close"
        onclick="document.getElementById('control-popup').close()"
      >
        X
      </div>

      <h1>
        Controls
      </h1>

      <div class="control-popup-info">
        <div>
          <img
            src="./assets/controls/arrows.png"
            alt="Arrow keys"
            height="100"
          >
        </div>

        <div>
          Up and Down to change speed.
          <br>
          Left and Right to steer.
        </div>

        <div>
          <img
            src="./assets/controls/wasd.png"
            alt="WASD controls"
            height="100"
          >
        </div>

        <div>
          W and S to change speed.
          <br>
          A and D to steer.
        </div>

        <div>
          <img
            src="./assets/controls/enter.png"
            alt="Enter Key"
            height="50"
          >
        </div>

        <div>
          Enter to open the command box.
        </div>
      </div>
    </dialog>
  </div>

  <div id="menu">
    <div id="hamburger"></div>
    <div id="speakerphone"></div>

    <div id="nav">
      <ul>
        <li id="customize">✈️ Plane Colors</li>
        <li id="settings">⚙️ Settings</li>
        <li id="projectInfo">
          <a
            href="https://github.com/little-flight/little-flight"
            style="color: inherit; text-decoration: inherit;"
            target="_blank">🌐️ Source Code
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div id="ui">
    <div id="welcome" style="display: block"></div>

    <div id="customizeMenu">
      <h3>Customise your plane</h3>
      
      <div class="planeColors">
        <div>
          <input
            type="color"
            id="outer"
            name="outer"
            value="#770619"
          />
          <label for="outer">Outer</label>
        </div>
        
        <div>
          <input
            type="color"
            id="innerMain"
            name="innerMain"
            value="#ac322e"
          />
          <label for="innerMain">Main</label>
        </div>

        <div>
          <input
            type="color"
            id="innerHighlight"
            name="innerHighlight"
            value="#d85665"
          />
          <label for="innerHighlight">Highlight</label>
        </div>
        
        <div>
          <input
            type="color"
            id="innerDarkHighlight"
            name="innerDarkHighlight"
            value="#8c0308"
          />
          <label for="innerDarkHighlight">Dark Highlight</label>
        </div>
        
        <div>
          <input
            type="color"
            id="aroundWindshield"
            name="aroundWindshield"
            value="#570101"
          />
          <label for="aroundWindshield">Around Windshield</label>
        </div>
        
        <div>
          <input
            type="color"
            id="windshield"
            name="windshield"
            value="#0ba0d2"
          />
          <label for="windshield">Windshield</label>
        </div>
        
        <div>
          <input
            type="color"
            id="propeller"
            name="propeller"
            value="#333333"
          />
          <label for="propeller">Propeller</label>
        </div>
        
        <div>
          <input
            type="color"
            id="propellerBlades"
            name="propellerBlades"
            value="#b3b3b3"
          />
          <label for="propellerBlades">Propeller Blades</label>
        </div>
        
        <img
          src="./css/default.png"
          alt="Reset Default Colors"
          id="resetDefault"
          height="35"
          width="150"
        >
      </div>
    </div>

    <div id="settingsMenu">
      <h3>Settings</h3>
      <div class="options">
        <div>
          <label id="color">Color</label>
        </div>
        <div>
          <label id="quality">Quality</label>
        </div>
        <div>
          <label id="seed">Seed</label>
        </div>
        <div>
          <label id="speed">Speed</label>
        </div>
        <div>
          <label id="settings-altitude">Altitude</label>
        </div>
        <div>
          <label id="coordinates">Coordinates</label>
        </div>
      </div>
    </div>
  </div>

  <input type="text" id="commandBox" autocomplete="off">
  <textarea id="result" disabled></textarea>
</body>
<footer>
  <script src="./engine/TerrainColor.js"></script>
  <script src="./engine/Perlin.js"></script>
  <script src="./engine/SHA256.js"></script>
  
  <script src="./engine/Sounds/dom.js"></script>
  <script src="./engine/Sounds/soundsengine.js"></script>
  <script src="./engine/Sounds/index.js"></script>
  
  <script src="./engine/Engine/dom.js"></script>
  <script src="./engine/Engine/setup.js"></script>
  <script src="./engine/Engine/utils.js"></script>
  <script src="./engine/Engine/terrain.js"></script>
  <script src="./engine/Engine/cloud.js"></script>
  <script src="./engine/Engine/engine.js"></script>
  <script src="./engine/Engine/timecycle.js"></script>
  <script src="./engine/Engine/index.js"></script>
  
  <script src="./engine/Plane/models.js"></script>
  <script src="./engine/Plane/graphics.js"></script>
  <script src="./engine/Plane/plane.js"></script>
  <script src="./engine/Plane/index.js"></script>
  
  <script src="./engine/CommandHandler.js"></script>
  <script src="./engine/Commands.js"></script>
  <script src="./engine/Instruments/BaseInstrument.js"></script>
  <script src="./engine/Instruments/Speedometer.js"></script>
  <script src="./engine/Instruments/Altimeter.js"></script>
  
  <script src="./engine/Controls/touch.js"></script>
  <script src="./engine/Controls/index.js"></script>
  
  <script src="./engine/Ui.js"></script>

  <script src="./engine/Multiplayer/actions.js"></script>
  <script src="./engine/Multiplayer/events.js"></script>
  <script src="./engine/Multiplayer/mp-handler.js"></script>
  <script src="./engine/Multiplayer/index.js"></script>
</footer>

</html>
